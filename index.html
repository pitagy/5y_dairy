<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5년 일기장 | My 5-Year Diary</title>
  <meta name="description" content="5년간의 소중한 기록을 담는 나만의 일기장">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  
  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e8845a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-512.png">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-content">
        <h1 class="app-title">
          <span class="title-icon">📖</span>
          <span>5년 일기장</span>
        </h1>
        <p class="app-subtitle" id="dateRange"></p>
      </div>
      <!-- Actions (Export/Import) -->
      <div class="header-actions">
        <button class="icon-btn" id="exportBtn" title="백업 (내보내기)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </button>
        <button class="icon-btn" id="importBtn" title="복구 (불러오기)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <!-- 5-Year View Toggle Button -->
        <button class="five-year-btn" id="fiveYearBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 4h16v16H4z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 10h16M10 4v16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>5년간 일기</span>
        </button>
      </div>
    </header>

    <!-- ========== Calendar View ========== -->
    <div id="calendarView">
      <!-- Navigation -->
      <nav class="nav-bar">
        <div class="year-selector">
          <button class="nav-btn" id="prevYear" aria-label="이전 년도" title="이전 년도">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12 4L6 10L12 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="year-dropdown-wrap">
            <button class="current-year-btn" id="yearSelectBtn" title="연도 직접 선택">
              <span id="currentYear">2026</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="year-dropdown-menu hidden" id="yearDropdownMenu"></div>
          </div>
          <button class="nav-btn" id="nextYear" aria-label="다음 년도" title="다음 년도">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M8 4L14 10L8 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="today-jump-btn" id="calTodayBtn" title="오늘 날짜로 이동">오늘</button>
        </div>
        <div class="month-tabs" id="monthTabs"></div>
      </nav>

      <!-- Calendar Grid -->
      <main class="diary-main">
        <div class="weekday-header" id="weekdayHeader"></div>
        <div class="diary-grid" id="diaryGrid"></div>
      </main>
    </div>

    <!-- ========== 5-Year View (Multi-Year View) ========== -->
    <div id="fiveYearView" class="five-year-view hidden">
      <nav class="nav-bar">
        <div class="fiveyr-date-nav">
          <button class="nav-btn" id="fiveYrPrevDay" aria-label="이전 날" title="어제">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12 4L6 10L12 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          
          <div class="date-picker-wrap">
            <button class="fiveyr-date-title-btn" id="fiveYrDatePickerBtn" title="날짜 변경">
              <span class="fiveyr-date-title" id="fiveYrDateTitle">3월 14일 일기</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <!-- Date Jump Popup -->
            <div class="date-picker-popup hidden" id="datePickerPopup">
              <div class="date-picker-header">날짜 선택</div>
              <div class="date-picker-controls">
                <select id="datePickerMonth" class="form-select"></select>
                <select id="datePickerDay" class="form-select"></select>
                <button id="datePickerApply" class="date-picker-apply-btn">이동</button>
              </div>
            </div>
          </div>

          <button class="nav-btn" id="fiveYrNextDay" aria-label="다음 날" title="내일">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M8 4L14 10L8 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="today-jump-btn" id="fiveYrTodayBtn" title="오늘 날짜로 이동">오늘</button>
        </div>

        <!-- Year Range Filter / Selector -->
        <div class="fiveyr-controls">
          <div class="preset-chips" id="presetChips">
            <button class="preset-chip" data-preset="3">최근 3년</button>
            <button class="preset-chip active" data-preset="5">최근 5년 (기본)</button>
            <button class="preset-chip" data-preset="10">최근 10년</button>
            <button class="preset-chip" data-preset="all">전체 기록</button>
          </div>
          <div class="custom-year-range">
            <span class="range-label">연도 선택:</span>
            <select id="startYearSelect" class="form-select year-select"></select>
            <span class="range-sep">~</span>
            <select id="endYearSelect" class="form-select year-select"></select>
          </div>
        </div>
      </nav>
      <main class="diary-main">
        <div class="fiveyr-entries" id="fiveYrEntries"></div>
      </main>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal" id="modal">
        <div class="modal-header">
          <h2 class="modal-date" id="modalDate"></h2>
          <div class="modal-actions">
            <button class="modal-btn save-btn" id="modalSave" title="저장">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="17,21 17,13 7,13 7,21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="7,3 7,8 15,8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span>저장</span>
            </button>
            <button class="modal-btn delete-btn" id="modalDelete" title="삭제">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><polyline points="3,6 5,6 21,6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span>삭제</span>
            </button>
            <button class="modal-btn close-btn" id="modalClose" title="닫기">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
          </div>
        </div>
        <div class="modal-body">
          <textarea class="modal-textarea" id="modalTextarea" placeholder="오늘의 이야기를 적어보세요..."></textarea>
        </div>
        <div class="modal-footer">
          <span class="char-count" id="charCount">0자</span>
          <span class="save-status" id="saveStatus"></span>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
